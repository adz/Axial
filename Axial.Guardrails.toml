version = 2
baseline = "Axial.Guardrails.baseline"

[default]
role = "domain"

[projects]
capabilities = ["src/Axial.Console/Axial.Console.fsproj", "src/Axial.FileSystem/Axial.FileSystem.fsproj", "src/Axial.HttpClient/Axial.HttpClient.fsproj", "src/Axial.PlatformService/Axial.PlatformService.fsproj", "src/Axial.Process/Axial.Process.fsproj", "src/Axial.WebSocket/Axial.WebSocket.fsproj"]
services = ["src/Axial.ElmishFlows/Axial.ElmishFlows.fsproj", "src/Axial.Files/Axial.Files.fsproj", "src/Axial.Telemetry/Axial.Telemetry.fsproj", "src/Axial.Telemetry.JavaScript/Axial.Telemetry.JavaScript.fsproj"]
domain = ["src/Axial/Axial.fsproj"]
host = ["src/Axial.Guardrails/Axial.Guardrails.fsproj", "src/Axial.Hosting*/Axial.Hosting*.fsproj", "src/Axial.Tool*/Axial.Tool*.fsproj", "examples/**/*.fsproj", "benchmarks/**/*.fsproj"]
test = ["tests/**/*.fsproj"]

[suppressions]
ignore = ["tests/Axial.Guardrails*/**", "tests/Axial.PrintfFixture/**", "benchmarks/Axial.Comparative/**"]

[boundaries]
files = ["benchmarks/Axial.Benchmarks/Common.fs", "benchmarks/Axial.Benchmarks/FiberCostBenchmarks.fs", "benchmarks/Axial.Benchmarks/Suites.fs", "examples/Axial.AotProbe/Program.fs", "examples/Axial.App.Example/Program.fs", "examples/Axial.Comparisons/CheckoutCompensation.fs", "examples/Axial.Comparisons/RetryBudget.fs", "examples/Axial.Comparisons/ScopedWorkspace.fs", "examples/Axial.Examples/Program.fs", "examples/Axial.Hosting.Desktop.Example/Program.fs", "examples/Axial.Hosting.DotNet.Example/Program.fs", "examples/Axial.MaintenanceExamples/Program.fs", "examples/Axial.TortureTest/Interop.fs", "examples/Axial.TortureTest/Scenario.fs", "src/Axial/App.fs", "src/Axial.Console/Console.fs", "src/Axial/Core.fs", "src/Axial.ElmishFlows/Sub.fs", "src/Axial.ElmishFlows/TestRuntime.fs", "src/Axial.FileSystem/FileSystem.fs", "src/Axial.Hosting/Hosting.fs", "src/Axial/Flow.fs", "src/Axial/Parallelism.fs", "src/Axial/Platform.fs", "src/Axial/Stream.fs", "src/Axial.PlatformService/Operations.fs", "src/Axial.PlatformService/Platform.fs", "src/Axial.Process/Process.fs", "src/Axial.Process/ProcessLive.fs", "src/Axial.Process/ProcessRun.fs", "src/Axial.WebSocket/WebSocket.fs", "tests/Axial.ElmishFlows.Tests/SubscriptionTests.fs", "tests/Axial.Fable.Tests/Harness.fs", "tests/Axial.HttpClient.Tests/HttpServiceTests.fs", "tests/Axial.Tests/ScopedResourceOwnershipTests.fs"]
