groups:
  - title: Axial.Result
    home: /error-handling/result
    kind: primary
    caption: Compose operations that can fail, using the standard F# Result type. Installs on its own.
    children_of:
      - /error-handling/result
    entries:
      - /error-handling/fstoolkit-comparison
    exclude:
      - /error-handling/reference
    reference:
      children_of:
        - /error-handling/reference/result

  - title: Values
    home: /error-handling
    kind: primary
    caption: Constraint, Refined, and Parse. A grouping, not a package — each installs independently.
    descendants: false
    entries:
      - /error-handling/getting-started
      - /error-handling/reference-app

  - title: Axial.Constraint
    home: /error-handling/constraint
    caption: One reusable description of valid values, shared by every interpreter.
    children_of:
      - /error-handling/constraint
    entries:
      - /error-handling/tutorials
    reference:
      children_of:
        - /error-handling/reference/constraint

  - title: Axial.Parse
    home: /error-handling/parse
    caption: Named parsers for serialized primitive values.
    descendants: false
    reference:
      children_of:
        - /error-handling/reference/parse

  - title: Axial.Refined
    home: /error-handling/refined
    caption: Construct values whose types record successful checks.
    children_of:
      - /error-handling/refined
    reference:
      children_of:
        - /error-handling/reference/refined
