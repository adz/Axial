groups:
  - title: Schema
    home: /schema
    kind: primary
    caption: Parse untrusted input through field constraints and domain constructors, or return path-aware diagnostics.
    descendants: false

  - title: Axial.Schema
    home: /schema/overview
    caption: The core package. JSON, HTTP, and testing packages extend it.
    descendants: false
    entries:
      - /schema/getting-started
      - /schema/overview-examples
      - /schema/tutorials
      - /schema/syntax
      - /schema/field-desugaring
      - /schema/input-sources
      - /schema/redisplay-and-field-errors
      - /schema/trusted-construction
      - /schema/refined-values
      - /schema/union-schemas
      - /schema/patterns
      - /schema/benchmarks
      - /schema/aot-trimming-fable
      - /schema/examples
      - /schema/reference-apps
      - /schema/comparisons
    reference:
      children_of:
        - /schema/reference/schema
    exclude:
      - /schema/reference/schema/http

  - title: Axial.Schema.Json
    home: /schema/json-codec
    caption: Compile a schema into a runtime-reflection-free JSON codec.
    reference:
      children_of:
        - /schema/reference/codec

  - title: Axial.Schema.JsonSchema
    home: /schema/reference/schema/m-schema-jsonschema-generate
    caption: Generate a compact JSON Schema document from a schema declaration.

  - title: Axial.Schema.Contracts
    home: /schema/contracts
    caption: Permissive wire schemas mapped to strict domain types, with explicit versioning.

  - title: Axial.Schema.Http
    home: /schema/http-servers
    caption: Schema-driven endpoints with problem-details errors and generated OpenAPI.
    reference:
      children_of:
        - /schema/reference/schema/http
    exclude:
      - /schema/reference/schema/http/aspnetcore
      - /schema/reference/schema/http/genhttp

  - title: Axial.Schema.Http.AspNetCore
    home: /schema/reference/schema/http/aspnetcore
    caption: Schema-trusted requests and responses for ASP.NET Core routing.

  - title: Axial.Schema.Http.GenHttp
    home: /schema/reference/schema/http/genhttp
    caption: Schema-trusted requests and responses for GenHTTP routing.

  - title: Axial.Schema.Testing
    home: /schema/patterns/testing-schema-guarantees
    caption: Derive accepted values from a schema and test rules, codecs, and mappings against them.

  - title: Product information
    home: /schema/packages-and-platforms
    caption: Package boundaries and .NET/Fable JavaScript support.
    entries:
      - /schema/agent
