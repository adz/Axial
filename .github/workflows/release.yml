name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out Axial tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must have the form vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check source inventory
        run: bash scripts/check-source-inventory.sh

      - name: Check release notes
        run: bash scripts/check-release-notes.sh "${{ steps.version.outputs.value }}"

      - name: Build
        run: dotnet build Axial.slnx --configuration Release --no-restore --nologo -v minimal -p:Version="${{ steps.version.outputs.value }}"

      - name: Test
        run: dotnet test Axial.slnx --configuration Release --no-build --nologo -v minimal

      - name: Validate Fable surface
        run: bash scripts/check-fable-js-surface.sh

      - name: Validate NativeAOT
        run: bash scripts/run-aot-probe.sh

      - name: Validate documentation
        run: |
          bash scripts/check-docs-conventions.sh
          # FsLiveDocs 0.3.5 loads project assemblies into one process and cannot validate
          # the version-stamped multi-target Release outputs. Validate a fresh Debug build.
          dotnet clean Axial.slnx --configuration Release --nologo -v minimal
          dotnet build Axial.slnx --configuration Debug --nologo -v minimal
          dotnet livedocs test --warn-as-error

      - name: Pack libraries
        run: bash scripts/pack.sh -v "${{ steps.version.outputs.value }}"

      - name: Capture immutable documentation
        id: docs
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          capsule="Axial-$version-livedocs.zip"
          mkdir -p artifacts/release
          dotnet livedocs capture --warn-as-error --version "$version" --output "artifacts/release/$capsule"
          echo "capsule=$capsule" >> "$GITHUB_OUTPUT"

      - name: Create draft release with immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          gh release create "$GITHUB_REF_NAME" --draft --notes-file "dev-docs/releases/$version.md" --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/package/*.nupkg \
            artifacts/package/*.snupkg \
            "artifacts/release/${{ steps.docs.outputs.capsule }}" \
            "artifacts/release/${{ steps.docs.outputs.capsule }}.report.json"
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release verify "$GITHUB_REF_NAME"

      - name: Publish release documentation to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          capsule="artifacts/release/${{ steps.docs.outputs.capsule }}"
          capsule_url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/${{ steps.docs.outputs.capsule }}"
          capsule_sha256="$(sha256sum "$capsule" | cut -d ' ' -f 1)"
          gh workflow run livedocs.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f version="$version" \
            -f capsule_url="$capsule_url" \
            -f capsule_sha256="$capsule_sha256"

      - name: Upload packages for NuGet publication
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/package/
          if-no-files-found: error

  publish-nuget:
    runs-on: ubuntu-latest
    needs: release
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/package

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/package/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          for package in artifacts/package/*.snupkg; do
            [ -e "$package" ] || continue
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
