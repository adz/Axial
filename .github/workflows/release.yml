name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  FSLIVEDOCS_ROOT: ${{ github.workspace }}/tools/FsLiveDocs

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out Axial tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out FsLiveDocs
        uses: actions/checkout@v4
        with:
          repository: adz/FsLiveDocs
          path: tools/FsLiveDocs

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          bash scripts/verify-release-history.sh "$version"
          declared_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          test "$declared_version" = "$version"

      - name: Check source inventory
        run: bash scripts/check-source-inventory.sh

      - name: Build
        run: dotnet build Axial.slnx --configuration Release --no-restore --nologo -v minimal

      - name: Test
        run: dotnet test Axial.slnx --configuration Release --no-build --nologo -v minimal

      - name: Validate Fable surface
        run: bash scripts/check-fable-js-surface.sh

      - name: Validate NativeAOT
        run: bash scripts/run-aot-probe.sh

      - name: Validate documentation
        run: bash scripts/validate-docs.sh

      - name: Pack libraries
        run: bash scripts/pack.sh -v "${{ steps.version.outputs.value }}"

      - name: Extract immutable API model
        id: model
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          model_asset="$(jq -r --arg version "$version" '.entries[] | select(.version == $version) | .modelAsset' .livedocs/history-manifest.json)"
          checksum_asset="$(jq -r --arg version "$version" '.entries[] | select(.version == $version) | .checksumAsset' .livedocs/history-manifest.json)"
          mkdir -p artifacts/release
          bash scripts/run-livedocs.sh extract --version "$version" --output "artifacts/release/$model_asset"
          (cd artifacts/release && sha256sum "$model_asset" > "$checksum_asset")
          bash scripts/verify-release-history.sh "$version" "artifacts/release/$model_asset" "artifacts/release/$checksum_asset"
          echo "model_asset=$model_asset" >> "$GITHUB_OUTPUT"
          echo "checksum_asset=$checksum_asset" >> "$GITHUB_OUTPUT"

      - name: Create draft release with immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/package/*.nupkg \
            artifacts/package/*.snupkg \
            "artifacts/release/${{ steps.model.outputs.model_asset }}" \
            "artifacts/release/${{ steps.model.outputs.checksum_asset }}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release verify "$GITHUB_REF_NAME"

      - name: Materialize tagged documentation history
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare-docs-history.sh

      - name: Build complete documentation history
        run: bash scripts/run-livedocs.sh build-history .livedocs/build-history/manifest.json

      - name: Prepare Pages artifact
        run: touch output/.nojekyll

      - name: Upload packages for NuGet publication
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/package/
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  publish-nuget:
    runs-on: ubuntu-latest
    needs: release
    environment: nuget
    permissions:
      contents: read

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/package

      - name: Publish NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in artifacts/package/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          for package in artifacts/package/*.snupkg; do
            [ -e "$package" ] || continue
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  deploy-pages:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
