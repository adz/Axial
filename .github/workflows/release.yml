name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - RELEASE_RESUME
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to resume
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out Axial tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(head -n 1 RELEASE_RESUME | tr -d '[:space:]')"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must have the form MAJOR.MINOR.PATCH; got $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check source inventory
        run: bash scripts/check-source-inventory.sh

      - name: Check release notes
        run: bash scripts/check-release-notes.sh "${{ steps.version.outputs.value }}"

      - name: Build
        run: dotnet build Axial.slnx --configuration Release --no-restore --nologo -v minimal -p:Version="${{ steps.version.outputs.value }}"

      - name: Validate documentation
        run: |
          bash scripts/check-docs-conventions.sh
          dotnet livedocs test --warn-as-error

      - name: Capture immutable documentation
        id: docs
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          capsule="Axial-$version-livedocs.zip"
          mkdir -p artifacts/release
          dotnet livedocs capture --warn-as-error --version "$version" --output "artifacts/release/$capsule"
          echo "capsule=$capsule" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test Axial.slnx --configuration Release --no-build --nologo -v minimal

      - name: Validate Fable surface
        run: bash scripts/check-fable-js-surface.sh

      - name: Validate NativeAOT
        run: bash scripts/run-aot-probe.sh

      - name: Pack libraries
        run: bash scripts/pack.sh -v "${{ steps.version.outputs.value }}"

      - name: Create draft release with immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; preserving its immutable assets."
            # A retry rebuilds the docs capsule locally, but its bytes (and therefore its
            # sha256) are not guaranteed to match what was actually uploaded on the first
            # successful attempt. Re-download the real asset so the checksum we hand to
            # livedocs.yml always matches what's actually at the release URL - otherwise
            # build-history's checksum verification fails (see the 0.7.0 LiveDocs failure).
            gh release download "$tag" \
              --pattern "${{ steps.docs.outputs.capsule }}" \
              --dir artifacts/release \
              --clobber
          else
            gh release create "$tag" --draft --notes-file "dev-docs/releases/$version.md" --title "$tag"
            gh release upload "$tag" \
              artifacts/package/*.nupkg \
              artifacts/package/*.snupkg \
              "artifacts/release/${{ steps.docs.outputs.capsule }}" \
              "artifacts/release/${{ steps.docs.outputs.capsule }}.report.json"
            gh release edit "$tag" --draft=false
          fi

      - name: Publish release documentation to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          capsule="artifacts/release/${{ steps.docs.outputs.capsule }}"
          capsule_url="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.docs.outputs.capsule }}"
          capsule_sha256="$(sha256sum "$capsule" | cut -d ' ' -f 1)"
          gh workflow run livedocs.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f version="$version" \
            -f capsule_url="$capsule_url" \
            -f capsule_sha256="$capsule_sha256"

      - name: Upload packages for NuGet publication
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/package/
          if-no-files-found: error

  publish-nuget:
    runs-on: ubuntu-latest
    needs: release
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/package

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Idempotency guard: a resumed release re-runs this job from scratch. Pushing the
          # same package+version twice races two independent symbol-validation passes on
          # nuget.org, and one of them can come back "failed" even though the first push
          # already landed a good package - see the Axial.PlatformService 0.7.0 symbol
          # validation emails from the first resumable-release attempt. So before pushing a
          # package, check whether that exact id+version is already live and skip it (both
          # its .nupkg and .snupkg) entirely rather than re-submitting.
          already_published() {
            local id="$1" version="$2"
            local url="https://api.nuget.org/v3-flatcontainer/${id,,}/${version,,}/${id,,}.${version,,}.nupkg"
            status="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            [ "$status" = "200" ]
          }

          for package in artifacts/package/*.nupkg; do
            filename="$(basename "$package" .nupkg)"
            version="${filename##*.[0-9]}"
            version="$(echo "$filename" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$')"
            id="${filename%."$version"}"

            if already_published "$id" "$version"; then
              echo "Skipping $filename: $id $version already published to NuGet."
              continue
            fi

            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

            snupkg="artifacts/package/$id.$version.snupkg"
            if [ -e "$snupkg" ]; then
              dotnet nuget push "$snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
