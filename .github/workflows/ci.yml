name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Guardrails baseline growth
        run: bash scripts/check-guardrails-baseline-growth.sh

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Check source inventory
        run: bash scripts/check-source-inventory.sh

      - name: Check release notes
        run: bash scripts/check-release-notes.sh

      - name: Build
        # Also runs Axial.Guardrails (see Directory.Build.targets) against every project it builds.
        run: dotnet build Axial.slnx --configuration Release --no-restore --nologo -v minimal

      - name: Test
        run: dotnet test Axial.slnx --configuration Release --no-build --nologo -v minimal

      - name: Test HTTP host adapters
        run: dotnet test tests/Axial.Hosting.Http.Tests --configuration Release --nologo -v minimal

      - name: Check shipped assemblies for FSharp.Core printf
        # Not in Axial.slnx: it builds every shipped project itself, including the HTTP adapters.
        run: dotnet test tests/Axial.Build.Tests --configuration Release --nologo -v minimal

      - name: Run main example
        run: dotnet run --project examples/Axial.Examples/Axial.Examples.fsproj --configuration Release --no-build --nologo

      - name: Run maintenance example
        run: dotnet run --project examples/Axial.MaintenanceExamples/Axial.MaintenanceExamples.fsproj --configuration Release --no-build --nologo

  fable:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Compile Fable JavaScript surface
        run: bash scripts/check-fable-js-surface.sh

      - name: Run Fable tests on Node
        run: bash scripts/run-fable-tests.sh

  native-aot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Publish and run NativeAOT probe
        run: bash scripts/run-aot-probe.sh

  packages:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Pack libraries
        run: bash scripts/pack.sh
