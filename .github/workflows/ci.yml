name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # About twice the slowest recent run (Build ~10 min, Test ~40 min): a hang fails fast instead of running for hours.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Check source inventory
        run: bash scripts/check-source-inventory.sh

      - name: Check release notes
        run: bash scripts/check-release-notes.sh

      - name: Build
        timeout-minutes: 30
        # Full typed coverage on every push. Policy review/approval remains a release gate:
        # pending human review must not make ordinary main pushes red.
        run: |
          bash scripts/ensure-guardrails-built.sh Release
          dotnet build Axial.slnx --configuration Release --no-restore --nologo -v minimal -p:AxialGuardrailsMode=Full

      - name: Test
        timeout-minutes: 80
        # A test host that makes no progress for 15 minutes is killed and named; dumps are too large to keep.
        run: dotnet test Axial.slnx --configuration Release --no-build --nologo -v minimal --blame-hang-timeout 15m --blame-hang-dump-type none

      - name: Test HTTP host adapters
        timeout-minutes: 20
        run: dotnet test tests/Axial.Hosting.Http.Tests --configuration Release --nologo -v minimal --blame-hang-timeout 15m --blame-hang-dump-type none

      - name: Check shipped assemblies for FSharp.Core printf
        timeout-minutes: 30
        # Not in Axial.slnx: it builds every shipped project itself, including the HTTP adapters.
        run: dotnet test tests/Axial.Build.Tests --configuration Release --nologo -v minimal --blame-hang-timeout 15m --blame-hang-dump-type none

      - name: Run main example
        timeout-minutes: 10
        run: dotnet run --project examples/Axial.Examples/Axial.Examples.fsproj --configuration Release --no-build --nologo

      - name: Run maintenance example
        timeout-minutes: 10
        run: dotnet run --project examples/Axial.MaintenanceExamples/Axial.MaintenanceExamples.fsproj --configuration Release --no-build --nologo

  fable:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Compile Fable JavaScript surface
        run: bash scripts/check-fable-js-surface.sh

      - name: Run Fable tests on Node
        run: bash scripts/run-fable-tests.sh

  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Publish and run NativeAOT probe
        run: bash scripts/run-aot-probe.sh

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Pack libraries
        run: bash scripts/pack.sh
