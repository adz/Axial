name: LiveDocs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet tool restore
      - run: dotnet restore
      - name: Build
        run: dotnet build Axial.slnx --configuration Release --no-restore --nologo -v minimal
      - name: Check documentation conventions
        run: bash scripts/check-docs-conventions.sh
      - name: Verify documentation
        run: dotnet livedocs test --warn-as-error
      - name: Render and verify release history
        run: |
          dotnet livedocs build-history .livedocs/history.json --retry 3 --interactive false --banner false
          dotnet livedocs verify-output .livedocs/history.json --output output --interactive false --banner false
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: output

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
