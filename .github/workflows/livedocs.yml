name: LiveDocs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scope by ref so a push to main cancels only earlier main runs, not an in-flight pull_request
  # verification with a different ref. Only main deploys Pages, and its runs still cancel each other.
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet tool restore
      - run: dotnet restore
      - name: Build
        if: github.event_name != 'workflow_dispatch'
        run: dotnet build Axial.slnx --configuration Release --no-restore --nologo -v minimal
      - name: Check documentation conventions
        if: github.event_name != 'workflow_dispatch'
        run: bash scripts/check-docs-conventions.sh
      - name: Verify documentation
        if: github.event_name != 'workflow_dispatch'
        run: dotnet livedocs test --warn-as-error
      # A workflow_dispatch from the release job is history-only: it renders and verifies the
      # committed capsules, so it neither builds the solution nor re-executes source examples.
      - name: Render and verify release history
        run: |
          dotnet livedocs build-history .livedocs/history.json --retry 3 --interactive false --banner false
          dotnet livedocs verify-output .livedocs/history.json --output output --interactive false --banner false
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: output

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
