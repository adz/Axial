<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 770" role="img" aria-labelledby="title description">
<title id="title">Process types and the functions connecting them</title>
<desc id="description">For scripts, ProcessCommand connects to ProcessSpec with another command, and run returns Exit. For applications, toFlow converts a ProcessSpec to a lazy Flow, and let! composes that step inside a larger Flow. For streaming, streamStdoutLines produces ProcessStream, ProcessStream.runCollect returns Flow, and the Process.run script helper returns Exit. Single commands also support all three execution paths. ProcessStream.toFlowStream converts to FlowStream for merging, zipping, and publishing into queues or hubs; stream terminals return a lazy Flow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#64748b" /></marker></defs>
<rect width="1440" height="770" rx="22" fill="#f6f8fb" />
<g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<text x="35" y="45" font-size="25" font-weight="700" fill="#172235">Short scripts</text>
<rect x="35" y="88" width="250" height="84" rx="13" fill="#ffffff" stroke="#0f9f8b" stroke-width="2" />
<text x="160" y="123" text-anchor="middle" font-size="25" font-weight="700" fill="#0f9f8b">ProcessCommand</text>
<text x="160" y="151" text-anchor="middle" font-size="21" fill="#475569">one command</text>
<rect x="415" y="88" width="250" height="84" rx="13" fill="#ffffff" stroke="#0f9f8b" stroke-width="2" />
<text x="540" y="123" text-anchor="middle" font-size="25" font-weight="700" fill="#0f9f8b">ProcessSpec</text>
<text x="540" y="151" text-anchor="middle" font-size="21" fill="#475569">connected commands</text>
<rect x="1170" y="88" width="250" height="84" rx="13" fill="#ffffff" stroke="#b45309" stroke-width="2" />
<text x="1295" y="123" text-anchor="middle" font-size="25" font-weight="700" fill="#b45309">Exit</text>
<text x="1295" y="151" text-anchor="middle" font-size="21" fill="#475569">finished outcome</text>
<path d="M295 130 H405" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="350.0" y="70" text-anchor="middle" font-size="19" fill="#172235">=&gt; another command</text>
<path d="M675 130 H1160" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="917.5" y="70" text-anchor="middle" font-size="19" fill="#172235">Process.run</text>
<text x="35" y="225" font-size="25" font-weight="700" fill="#172235">Application workflows</text>
<rect x="35" y="268" width="250" height="84" rx="13" fill="#ffffff" stroke="#0f9f8b" stroke-width="2" />
<text x="160" y="303" text-anchor="middle" font-size="25" font-weight="700" fill="#0f9f8b">ProcessSpec</text>
<text x="160" y="331" text-anchor="middle" font-size="21" fill="#475569">command description</text>
<rect x="795" y="268" width="250" height="84" rx="13" fill="#ffffff" stroke="#7c56d9" stroke-width="2" />
<text x="920" y="303" text-anchor="middle" font-size="25" font-weight="700" fill="#7c56d9">Flow</text>
<text x="920" y="331" text-anchor="middle" font-size="21" fill="#475569">lazy workflow step</text>
<rect x="1170" y="268" width="250" height="84" rx="13" fill="#ffffff" stroke="#7c56d9" stroke-width="2" />
<text x="1295" y="303" text-anchor="middle" font-size="25" font-weight="700" fill="#7c56d9">Flow</text>
<text x="1295" y="331" text-anchor="middle" font-size="21" fill="#475569">larger application</text>
<path d="M295 310 H785" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="540.0" y="250" text-anchor="middle" font-size="19" fill="#172235">toFlow</text>
<path d="M1055 310 H1160" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="1107.5" y="250" text-anchor="middle" font-size="19" fill="#172235">let! in flow { }</text>
<text x="35" y="405" font-size="25" font-weight="700" fill="#172235">Streaming output</text>
<rect x="35" y="448" width="250" height="84" rx="13" fill="#ffffff" stroke="#0f9f8b" stroke-width="2" />
<text x="160" y="483" text-anchor="middle" font-size="25" font-weight="700" fill="#0f9f8b">ProcessSpec</text>
<text x="160" y="511" text-anchor="middle" font-size="21" fill="#475569">command description</text>
<rect x="415" y="448" width="250" height="84" rx="13" fill="#ffffff" stroke="#7c56d9" stroke-width="2" />
<text x="540" y="483" text-anchor="middle" font-size="25" font-weight="700" fill="#7c56d9">ProcessStream</text>
<text x="540" y="511" text-anchor="middle" font-size="21" fill="#475569">output as it arrives</text>
<rect x="795" y="448" width="250" height="84" rx="13" fill="#ffffff" stroke="#7c56d9" stroke-width="2" />
<text x="920" y="483" text-anchor="middle" font-size="25" font-weight="700" fill="#7c56d9">Flow</text>
<text x="920" y="511" text-anchor="middle" font-size="21" fill="#475569">lazy consumer</text>
<rect x="1170" y="448" width="250" height="84" rx="13" fill="#ffffff" stroke="#b45309" stroke-width="2" />
<text x="1295" y="483" text-anchor="middle" font-size="25" font-weight="700" fill="#b45309">Exit</text>
<text x="1295" y="511" text-anchor="middle" font-size="21" fill="#475569">finished outcome</text>
<path d="M295 490 H405" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="350.0" y="430" text-anchor="middle" font-size="19" fill="#172235">streamStdoutLines</text>
<path d="M675 490 H785" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="730.0" y="430" text-anchor="middle" font-size="19" fill="#172235">ProcessStream.runCollect</text>
<path d="M1055 490 H1160" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="1107.5" y="430" text-anchor="middle" font-size="19" fill="#172235">Process.run</text>
<text x="35" y="585" font-size="25" fill="#172235">Combine streams or publish values</text><rect x="35" y="628" width="250" height="84" rx="13" fill="#ffffff" stroke="#7c56d9" stroke-width="2" /><text x="160" y="663" font-size="25" fill="#7c56d9" text-anchor="middle">ProcessStream</text><text x="160" y="691" font-size="21" fill="#475569" text-anchor="middle">process output</text><rect x="415" y="628" width="250" height="84" rx="13" fill="#ffffff" stroke="#7c56d9" stroke-width="2" /><text x="540" y="663" font-size="25" fill="#7c56d9" text-anchor="middle">FlowStream</text><text x="540" y="691" font-size="21" fill="#475569" text-anchor="middle">general stream</text><rect x="1170" y="628" width="250" height="84" rx="13" fill="#ffffff" stroke="#7c56d9" stroke-width="2" /><text x="1295" y="663" font-size="25" fill="#7c56d9" text-anchor="middle">Flow</text><text x="1295" y="691" font-size="21" fill="#475569" text-anchor="middle">lazy consumer</text><path d="M295 670 H405" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" /><text x="350.0" y="610" font-size="19" fill="#172235" text-anchor="middle">toFlowStream</text><path d="M675 670 H1160" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" /><text x="917.5" y="610" font-size="19" fill="#172235" text-anchor="middle">mergePar / zip → runIntoQueue / runIntoHub</text></g></svg>
