<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">The three parts of a Flow type</title>
  <desc id="description">Flow env error value, with arrows to cards explaining environment, expected failures, and the success value.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#161224"/></linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31d0af"/><stop offset="1" stop-color="#74e6d0"/></linearGradient>
    <linearGradient id="error" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff737d"/><stop offset="1" stop-color="#ffafb1"/></linearGradient>
    <linearGradient id="value" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a70ef"/><stop offset="1" stop-color="#d09aff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#canvas)"/>
  <text x="600" y="115" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-3" fill="#f8fafc">Flow&lt; <tspan fill="url(#env)">'env</tspan>, <tspan fill="url(#error)">'error</tspan>, <tspan fill="url(#value)">'value</tspan> &gt;</text>
  <path d="M380 142 C380 188 222 178 222 245" fill="none" stroke="url(#env)" stroke-width="9" stroke-linecap="round"/>
  <path d="M222 245 l-12 -18 M222 245 l12 -18" fill="none" stroke="#31d0af" stroke-width="9" stroke-linecap="round"/>
  <path d="M600 142 C600 190 600 198 600 245" fill="none" stroke="url(#error)" stroke-width="9" stroke-linecap="round"/>
  <path d="M600 245 l-12 -18 M600 245 l12 -18" fill="none" stroke="#ff737d" stroke-width="9" stroke-linecap="round"/>
  <path d="M827 142 C827 188 978 178 978 245" fill="none" stroke="url(#value)" stroke-width="9" stroke-linecap="round"/>
  <path d="M978 245 l-12 -18 M978 245 l12 -18" fill="none" stroke="#9a70ef" stroke-width="9" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="65" y="245" width="315" height="275" rx="24" fill="#10192b" stroke="#31d0af" stroke-width="3"/>
    <rect x="443" y="245" width="315" height="275" rx="24" fill="#10192b" stroke="#ff737d" stroke-width="3"/>
    <rect x="820" y="245" width="315" height="275" rx="24" fill="#10192b" stroke="#9a70ef" stroke-width="3"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="98" y="310" font-size="29" font-weight="800" fill="#49dfc1">'env</text><text x="174" y="310" font-size="22" font-weight="700" fill="#49dfc1">capabilities</text><text x="98" y="350" font-size="24" fill="#e5e7eb">The services and</text><text x="98" y="382" font-size="24" fill="#e5e7eb">configuration the</text><text x="98" y="414" font-size="24" fill="#e5e7eb">workflow receives</text><text x="98" y="446" font-size="24" fill="#e5e7eb">when it runs.</text>
    <text x="476" y="310" font-size="29" font-weight="800" fill="#ff8890">'error</text><text x="476" y="350" font-size="24" fill="#e5e7eb">Expected failures</text><text x="476" y="382" font-size="24" fill="#e5e7eb">the caller can</text><text x="476" y="414" font-size="24" fill="#e5e7eb">handle explicitly.</text>
    <text x="853" y="310" font-size="29" font-weight="800" fill="#ba83ff">'value</text><text x="853" y="350" font-size="24" fill="#e5e7eb">The value produced</text><text x="853" y="382" font-size="24" fill="#e5e7eb">when the workflow</text><text x="853" y="414" font-size="24" fill="#e5e7eb">succeeds.</text>
  </g>
</svg>
